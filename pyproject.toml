[project]
name = "events-aggregator"
version = "0.1.0"
description = "Events Aggregator backend service"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "httpx>=0.28",
    "httpx2>=2.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
